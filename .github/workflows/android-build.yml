name: Android build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate launcher icons from the NK PLAYER logo
        # Uses nk-icon.png (repo root or branding/) or any single square PNG >= 512px in the repo root.
        # If no logo PNG is found the existing icon is kept and the build continues.
        continue-on-error: true
        run: |
          python3 -m pip install --quiet --break-system-packages pillow || python3 -m pip install --quiet pillow
          python3 tools/make_icons.py
      - name: Verify UI/UX Pro Max skill
        run: |
          python3 -m py_compile .agents/skills/ui-ux-pro-max/scripts/*.py
          python3 .agents/skills/ui-ux-pro-max/scripts/search.py "native media player accessible controls" --stack jetpack-compose
          python3 .agents/skills/ui-ux-pro-max/scripts/search.py "mobile app contrast touch target accessibility" --domain ux
          python3 .agents/skills/ui-ux-pro-max/scripts/search.py "dark media player android interface" --design-system --project-name "NK PLAYER"
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug and optimized release APKs
        run: |
          set -o pipefail
          gradle assembleDebug assembleRelease 2>&1 | tee build.log
          echo "APK SIZE REPORT"
          ls -lh app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk
      - name: Report build errors
        if: failure()
        run: |
          grep -E '^e: |What went wrong|error:' -A3 build.log | head -60 | while IFS= read -r line; do echo "::error::${line}"; done || true
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nk-player-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload optimized release APK
        uses: actions/upload-artifact@v4
        with:
          name: nk-player-release-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14
