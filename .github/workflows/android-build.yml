name: Android build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify UI/UX Pro Max skill
        run: |
          python3 -m py_compile .agents/skills/ui-ux-pro-max/scripts/*.py
          python3 .agents/skills/ui-ux-pro-max/scripts/search.py "native media player accessible controls" --stack jetpack-compose
          python3 .agents/skills/ui-ux-pro-max/scripts/search.py "mobile app contrast touch target accessibility" --domain ux
          python3 .agents/skills/ui-ux-pro-max/scripts/search.py "dark media player android interface" --design-system --project-name "NK PLAYER"
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nk-player-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
